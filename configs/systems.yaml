# Baseline systems as run for EthioBench-ASR. Each entry declares the settings passed
# to its system, with a reason field or, for Omnilingual, the comment above the entries.
# `revision` pins the weights, and an unpinned system is refused. The runner splits audio
# longer than 30 s, or the system's input limit if lower, into pieces and joins the
# transcripts. A system is told the language wherever its authors provide a way, such
# as Whisper's language token or MMS's adapter. Otherwise none is set.

systems:

  - id: whisper-large-v3
    hf_repo: openai/whisper-large-v3
    revision: 06f233fe06e710322aca913c1bc4249a0d71fce1
    family: seq2seq
    dtype: float16
    dtype_reason: Whisper's standard inference precision.
    language: am
    language_reason: >
      Whisper lists Amharic. Forced, so the score does not include language
      identification.
    task: transcribe
    decoding:
      num_beams: 1
      do_sample: false
      max_new_tokens: 440
    decoding_reason: >
      Greedy decoding is deterministic and the transformers default. The cap
      sits under Whisper's 448-token limit. An output reaching it is flagged as
      a likely repetition loop.
    input_limit_s: 30
    input_limit_reason: >
      Whisper's encoder window. Longer audio is split into pieces of at most
      30 s, and the transcripts are joined.

  - id: mms-1b-all
    hf_repo: facebook/mms-1b-all
    revision: 3d33597edbdaaba14a8e858e2c8caa76e3cec0cd
    family: ctc
    dtype: float32
    dtype_reason: Rules out half-precision instability in CTC logits.
    target_lang: amh
    target_lang_reason: The Amharic adapter and vocabulary, as MMS's documentation requires.
    decoding: {strategy: greedy_argmax}
    decoding_reason: No language model. Greedy CTC is the documented inference path.

  - id: ethio-asr-multilingual-1b
    hf_repo: badrex/Ethio-ASR-multilingual-1B
    revision: 7f6dd43f388cd16bb70f0f3662dbcfcefedc5560
    family: ctc
    dtype: float32
    dtype_reason: Float32, as the other CTC baselines. The model is fine-tuned from facebook/mms-1b.
    target_lang: null
    target_lang_reason: >
      Joint recognition and language identification over five Ethiopian
      languages. Its documented usage passes no language.
    decoding: {strategy: greedy_argmax}
    decoding_reason: Greedy CTC, as in the model card's usage example.
    output_language_tags: true
    output_language_tags_reason: >
      Usually writes a language tag such as [AMH] at the start. Some outputs
      also carry one at the end or inside the text, and some carry none.
      Stored hypotheses keep the tags. The scorer removes them and reports them.

  - id: ethio-asr-multilingual-600m
    hf_repo: badrex/Ethio-ASR-multilingual-600M
    revision: 5a099192a8a56f118d3515f70f5f44428fd29730
    family: ctc
    dtype: float32
    dtype_reason: As the other CTC baselines.
    target_lang: null
    target_lang_reason: As ethio-asr-multilingual-1b. There is no language setting.
    decoding: {strategy: greedy_argmax}
    decoding_reason: Greedy CTC, as in the model card's usage example.
    output_language_tags: true
    output_language_tags_reason: Same five-tag vocabulary as the 1B model.
    selection_reason: >
      The family's best multilingual model on WAXAL (22.92 amh against 26.14
      for the 1B), w2v-bert-2.0, CC-BY-4.0.

  - id: ethio-asr-amharic
    hf_repo: badrex/Ethio-ASR-amharic
    revision: edda1ab0af0d3cca4f4a6fd0b17ef3726bcce12a
    family: ctc
    dtype: float32
    dtype_reason: As the other CTC baselines.
    target_lang: null
    target_lang_reason: Monolingual Amharic (w2v-bert-2.0, 600M). It writes no language tags.
    decoding: {strategy: greedy_argmax}
    decoding_reason: Greedy CTC, as in the model card's usage example.
    selection_reason: >
      The authors' best Amharic result (22.37 WER on WAXAL test, against 26.14
      for the 1B multilingual).

  - id: ethio-asr-tigrinya
    hf_repo: badrex/Ethio-ASR-tigrinya
    revision: 16b0de6027bc5b3764e10ea576bc9698cf1844a1
    family: ctc
    dtype: float32
    dtype_reason: As ethio-asr-amharic.
    target_lang: null
    target_lang_reason: Monolingual Tigrinya model, run on the Tigrinya sets only.
    decoding: {strategy: greedy_argmax}
    decoding_reason: Greedy CTC, as in the model card's usage example.

  - id: whisper-small
    hf_repo: openai/whisper-small
    revision: 973afd24965f72e36ca33b3055d56a652f456b4d
    family: seq2seq
    dtype: float16
    dtype_reason: As whisper-large-v3.
    language: am
    language_reason: As whisper-large-v3.
    task: transcribe
    decoding:
      num_beams: 1
      do_sample: false
      max_new_tokens: 440
    decoding_reason: As whisper-large-v3.
    input_limit_s: 30
    input_limit_reason: Whisper's encoder window.
    selection_reason: Baseline in the Ethio-ASR paper (Table 3).

  - id: seamless-m4t-v2-large
    hf_repo: facebook/seamless-m4t-v2-large
    revision: 5f8cc790b19fc3f67a61c105133b20b34e3dcb76
    family: seamless
    dtype: float16
    dtype_reason: Half precision, as for Whisper.
    tgt_lang: amh
    tgt_lang_reason: SeamlessM4T speech-to-text requires a target language. Transcription sets it to the source language.
    decoding:
      num_beams: 1
      do_sample: false
      max_new_tokens: 440
    decoding_reason: Greedy and capped as the Whisper baselines.
    selection_reason: Baseline in the Ethio-ASR paper (Table 3). CC-BY-NC-4.0.

  # Omnilingual ASR v2 (Meta, Apache-2.0). `revision` is the checkpoint's sha256,
  # checked before loading. The pipeline defaults are kept. They are bfloat16, LLM
  # decoding with nbest 1 and no length normalization, and the built-in
  # compression-ratio stop. CTC models take no language code. LLM models take
  # amh_Ethi, as the authors recommend.
  - id: omni-ctc-300m-v2
