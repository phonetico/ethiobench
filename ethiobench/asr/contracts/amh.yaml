# Amharic normalization contract for EthioBench-ASR scoring.
# Every rule this contract applies is declared here, with two exceptions. Punctuation
# removal also deletes symbols and joins English apostrophes, so don't becomes dont.
# A system's language tags are stripped as its systems.yaml entry declares.
# An override is reported with the results.
# The layers run in order. base runs in both modes, and fluent and verbatim are the
# two modes. wer_n runs over either mode. pending rules are declared but not applied,
# and a result scored while any is pending is marked provisional.

language: amh
version: 0.9.0


conforms_to:
  note: >
    The folds this contract applies, the characters it leaves unfolded and
    the abbreviation expansions it reads are declared below. Agreement with
    any other implementation is not claimed here.

# A filler matches only fillers of its own class.
filler_inventory:
  version: "1.0-provisional"
  classes:
    amh: [እ, እም, አ]
    eng: [um, uh]
  source: Amharic provisional; English fixed

pipeline:

  base:

    - step: unicode_nfc
      justification: >
        NFC gives a character a single stored form. Ge'ez characters already
        have only one, so the step changes only Latin text, such as an accented
        letter typed two ways.

    - step: strip_zero_width
      justification: >
        Zero-width characters are invisible and carry no text. Left in, they
        would make two equal words compare unequal.

    - step: strip_bracket_tags
      justification: >
        No reference in these sets carries a bracket tag. The step removes the
        tags [unclear:SS.S], [overlap:SS.S], [laughter], [cough] and [noise]
        wherever they occur. None of them is scored as a word.

    - step: mark_fragments
      justification: >
        A trailing hyphen marks a word the speaker began and did not finish,
        as in ከስን-. Punctuation removal would delete the hyphen, so this step
        marks the word first. Fluent mode then drops it from the reference.
        Verbatim mode keeps it without the hyphen.

    - step: expand_abbreviations
      table: amh_abbreviations.tsv
      justification: >
        Readers say abbreviations in full. A reader of 2015 ዓ.ም says ዓመተ
        ምህረት, and of እ.ኤ.አ says እንደ ኤውሮፓውያን አቆጣጠር. References record what
        was said, and systems write either form. Both sides are therefore
        rewritten to the spoken form. The table lists each written form of an
        abbreviation, whether dotted, slashed, dotless or spaced. It spells
        each expansion as edited Ethiopian news text does. Ambiguous
        abbreviations such as ጠ/ሚ, ሚ/ር and አ.አ are not expanded. Each stays
        one word, so አ.አ is not read as two fillers. Where a
        speaker read out the letters, the reference keeps the abbreviation and
        both sides expand it alike.

    - step: numerals
      direction: as_recorded
      justification: >
        References write every number in words. A system that writes the
        number in other words is wrong. A system may write it in digits
        instead. The digits are correct when they match the number's digit
        form. Some numbers have their digit form recorded with the reference,
        checked against the audio. Where ሁለት ሰዓት ተኩል is recorded as 2:30,
        2:30 is correct and ሁለት ከሰላሳ counts as wrong words. For the other
        numbers, the parser reads the digit form from the words. It reads
        ዘጠኝ ሰዓት ተኩል only as 9, so 9:30 misses where no form was recorded.
        Any other digit token counts as a wrong word, Ge'ez numerals such as ፲፭
        included. The --numerals option selects another rule, and the report
        records the choice.

    - step: remove_punctuation
      justification: >
        Punctuation is not heard, and systems differ in whether they write it.
        Each mark becomes a word boundary. Inside a number the decimal point
        stays and a digit-group comma goes, so 10,693 stays one token.
      retains: [decimal_point]

    - step: casefold
      justification: >
        Ge'ez has no case, so this applies to Latin script only. A capitalized
        English word inside Amharic is not an error.

    - step: collapse_whitespace
      justification: >
        Words are split on whitespace. Repeated or trailing spaces would
        otherwise produce empty words.

  fluent:

    - step: remove_fillers
      justification: >
        Fluent mode removes every filler in the inventory from both sides. A
        system that leaves fillers out is not counted wrong.

    - step: remove_fragments
      sides: [reference]
      justification: >
        Fluent mode removes unfinished words from the reference only. A
        system's words are scored as written.

  verbatim:

    - step: unmark_fragments
      justification: >
        Verbatim mode keeps an unfinished word without its hyphen. A system
        that transcribes the partial word matches it.

    - step: filler_equivalence
      justification: >
        In verbatim mode a filler matches another filler of the same language.
        እም for እ is correct. English um for Amharic እ is wrong.

# WER-N treats these characters as the same during alignment only. No reference is
# rewritten. Reports give WER beside WER-N, and the difference is the orthographic gap.
# A set is declared by series and folds all seven vowel orders, so ሀ/ሐ/ኀ also folds
# ሁ/ሑ/ኁ. The first member is the target. The eighth order folds only where both
# members have one and Unicode names the same vowel.
wer_n:

  step: fold_orthography
  justification: >
    Some Amharic letters are written differently for the same sound, and
    writers differ on which to use. Without folding, WER would count a
    spelling choice as a recognition error.

  equivalence_sets:

    - name: h-series
      members: [ሀ, ሐ, ኀ]
      unfolded: [ሓ]
      justification: >
        ሀ, ሐ and ኀ are all [h] in modern Amharic. A word's spelling follows its
        history. ሓ stays unfolded because it is not an Amharic spelling of ሃ,
        ሀ, ሐ, ኻ or ኃ.

    - name: kha-series
      members: [ሁ, ኹ]
      orders: [ሁሂሃሄህሆ, ኹኺኻኼኽኾ]
      unfolded: [ኻ]
      justification: >
        The ኸ series folds to the ሀ series in orders 2, 3, 5, 6 and 7. ኸ itself
        stays distinct. ኻ stays distinct too. It is rare in written Amharic
        and mostly writes /x/ in names such as ኻርቱም and ኻሜኒ, or in Tigrinya
        words. It does not occur in the frozen references.

    - name: ha-a-order
      members: [ሀ, ሃ]
      orders: [ሀ, ሃ]
      justification: >
        ሃ and ሀ are written interchangeably for /ha/. Together with the
        h-series, this folds ኃ to ሀ. ሓ and ኻ stay unfolded.

    - name: labialized-go
      members: [ጎ, ጐ]
      orders: [ጎ, ጐ]
      justification: >
        ጐ is written for ጎ, as in ጐረቤት and ጎረቤት. ጓ is not folded.

    - name: labialized-ko-qo-ho
      members: [ቆ, ቈ]
      orders: [ቆኮሆ, ቈኰኈ]
      justification: >
        EthioBench extends the ጐ rule. ቈ, ኰ and ኈ are written for ቆ, ኮ and ሆ in
        the same way.

    - name: s-series
      members: [ሰ, ሠ]
      justification: >
        ሰ and ሠ are both [s]. Some words keep ሠ from their history, as in ሥራ
        "work".

    - name: ts-series
      members: [ጸ, ፀ]
      justification: >
        ጸ and ፀ are one sound. Which letter a word takes varies by region and
        schooling.

    - name: glottal-series
      members: [አ, ዐ]
      orders: [አኡኢአኤእኦ, ዐዑዒዓዔዕዖ]
      justification: >
        አ and ዐ are both [ʔ]. ዐ appears mainly in religious and literary
        writing. The orders are listed so that ዓ folds straight to አ. ኣ is not
        an Amharic spelling and stays unfolded. ኧ is not folded.

# ዉ and ው are not folded. Transcribers interchange them, and folding would hide that.

# The loanword table gives each word's canonical form, a pattern that generates every
# spelling the linguists ruled the same word, and the established spellings. It folds
# whole words only. Affixed forms are counted under spelling_under_affix and not folded.
loanwords:
  step: normalize_loanwords
  table: amh_loanwords.tsv
  profiles: [lenient, strict]
  justification: >
    A loanword has no settled spelling in fidel. Spellings of one word are
    folded together on both sides, whole words only. The lenient profile
    accepts every spelling the table's pattern generates. The strict profile
    accepts the canonical spelling and the spellings established in edited
    Ethiopian news text. Both are reported.

# Rules declared but not applied. Every result records them.
pending:

  - step: normalize_amharic_spelling
    blocked_by: no agreed table of accepted written forms
    justification: >
      Some Amharic words have more than one accepted spelling beyond the
      letter folds. There is no agreed table of them yet.

# These sets are Amharic's alone. In Tigrinya the same characters are distinct letters,
# so folding there would score wrong characters as correct. A language without its own
# contract is an error, never a fallback to this file.
