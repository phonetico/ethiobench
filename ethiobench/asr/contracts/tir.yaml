# Tigrinya normalization contract for EthioBench-ASR scoring.
# The layers are as in amh.yaml. Nothing is inherited from Amharic.

language: tir
version: 0.2.1


conforms_to:
  implementation: null
  note: >
    Tigrinya declares no folds. The characters Amharic merged are distinct
    sounds in Tigrinya.

# እ and እም are written as fillers in the verified references. The English class is the
# same as Amharic's. Standalone አ also occurs as a filler in tir-panel and is not in the
# inventory. Provisional until the Tigrinya team proposes an inventory.
filler_inventory:
  version: "tir-observed-1.0"
  classes:
    tir: [እ, እም]
    eng: [um, uh]
  source: observed in verified Tigrinya references; provisional

pipeline:

  base:

    - step: unicode_nfc
      justification: >
        NFC gives a character a single stored form. Ge'ez characters already
        have only one, so the step changes only Latin text, such as an accented
        letter typed two ways.

    - step: strip_zero_width
      justification: >
        Zero-width characters are invisible and carry no text. Left in, they
        would make two equal words compare unequal.

    - step: strip_bracket_tags
      justification: >
        No reference in these sets carries a bracket tag. The step removes the
        tags [unclear:SS.S], [overlap:SS.S], [laughter], [cough] and [noise]
        wherever they occur. None of them is scored as a word.

    - step: mark_fragments
      justification: >
        A trailing hyphen marks a word the speaker began and did not finish,
        as in ምኽንያ-. Punctuation removal would delete the hyphen, so this step
        marks the word first.

    - step: numerals
      direction: to_digits
      justification: >
        Number words and digits are rewritten to one value on both sides. A
        number then counts as correct whether it is written in words or in
        digits. ክልተ ሽሕ ዓሰርተ ሓሙሽተ and 2015 both become 2015. The parser reads
        the number words it knows. A reading it does not compose stays apart,
        so ዕስራ ዓሰርተ ሓሙሽተ becomes 20 15 and does not match 2015. The
        Tigrinya references have no recorded digit forms, which as_recorded
        needs. The --numerals option selects to_words or off, and the report
        records the choice.

    - step: remove_punctuation
      justification: >
        Punctuation is not heard, and systems differ in whether they write it.
        Each mark becomes a word boundary. Inside a number the decimal point
        stays and a digit-group comma goes.
      retains: [decimal_point]

    - step: casefold
      justification: >
        Ge'ez has no case, so this applies to Latin script only.

    - step: collapse_whitespace
      justification: >
        Words are split on whitespace. Repeated or trailing spaces would
        otherwise produce empty words.

  fluent:

    - step: remove_fillers
      justification: >
        Fluent mode removes every filler in the inventory from both sides. A
        system that leaves fillers out is not counted wrong.

    - step: remove_fragments
      sides: [reference]
      justification: >
        Fluent mode removes unfinished words from the reference only. A
        system's words are scored as written.

  verbatim:

    - step: unmark_fragments
      justification: >
        Verbatim mode keeps an unfinished word without its hyphen. A system
        that transcribes the partial word matches it.

    - step: filler_equivalence
      justification: >
        In verbatim mode a filler matches another filler of the same language.
        እም for እ is correct. English um for Tigrinya እ is wrong.

# There is no wer_n layer, so WER-N equals WER. In Tigrinya the letters Amharic merges
# write distinct sounds, so folding them would score wrong characters as correct.

# Rules declared but not applied. Every result records them.
pending:

  - step: normalize_loanwords
    blocked_by: no Tigrinya variant table
    justification: >
      No Tigrinya loanword table exists, and the Amharic one does not transfer.
